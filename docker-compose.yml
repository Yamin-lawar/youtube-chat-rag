services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - '6333:6333' # REST API + dashboard (http://localhost:6333/dashboard)
      - '6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ytchat
      POSTGRES_PASSWORD: ytchat
      POSTGRES_DB: ytchat
    ports:
      # The host port can be changed in .env (POSTGRES_PORT) if another Postgres already uses 5432.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ytchat']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
